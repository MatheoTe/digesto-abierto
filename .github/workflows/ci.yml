name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24
  # CI never talks to paid APIs: offline providers keep every job deterministic.
  DIGESTO_LLM_PROVIDER: offline
  DIGESTO_EMBEDDINGS_PROVIDER: local
  DIGESTO_RERANKER: none
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Typecheck · lint · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit

  integration:
    name: Integration tests (Postgres + pgvector + unaccent)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: digesto
          POSTGRES_PASSWORD: digesto
          POSTGRES_DB: digesto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digesto -d digesto_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://digesto:digesto@localhost:5432/digesto_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  build-e2e:
    name: Build · E2E (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: digesto
          POSTGRES_PASSWORD: digesto
          POSTGRES_DB: digesto_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digesto -d digesto_e2e"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      E2E_DATABASE_URL: postgres://digesto:digesto@localhost:5432/digesto_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
